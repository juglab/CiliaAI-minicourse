[project]
name = "denoise-n2v"
version = "0.1.0"
description = "Noise2Void denoising exercise (legacy TensorFlow stack)"
requires-python = "==3.9.*"
dependencies = [
    "numpy==1.24.3",
    "tifffile",
    "n2v",
    # TensorFlow 2.13 (N2V does not work with TF >= 2.16).
    # On some platforms the "tensorflow" wheel is only an empty shim, so we
    # name the package that actually contains TensorFlow for each platform.
    "tensorflow==2.13.* ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorflow==2.13.* ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tensorflow-cpu-aws==2.13.* ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tensorflow-intel==2.13.* ; sys_platform == 'win32'",
    "tensorflow-macos==2.13.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
# Only resolve for the platforms students actually use
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
